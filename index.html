const fmtShort=d=>{const dt=new Date(d+"T12:00:00");return dt.getDate()+" "+dt.toLocaleDateString("es-ES",{month:"short"});};
const fmtFull=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"long"});
const monthName=d=>new Date(d+"-01T12:00:00").toLocaleDateString("es-ES",{month:"long",year:"numeric"});
const isToday=d=>new Date(d+"T12:00:00").toDateString()===new Date().toDateString();
const isPast=d=>new Date(d+"T12:00:00")<new Date()&&!isToday(d);
const groupM=arr=>{const g={};arr.forEach(s=>{const m=s.date.slice(0,7);if(!g[m])g[m]=[];g[m].push(s);});return g;};

// ── LOGIN SCREEN ──────────────────────────────────────────────
function LoginScreen({onLogin}){
  const [pin,setPin]=React.useState("");
  const [error,setError]=React.useState(false);
  const [shake,setShake]=React.useState(false);

  const press=d=>{
    if(pin.length>=5)return;
    const next=pin+d;
    setPin(next);
    setError(false);
    if(next.length>=4){
      setTimeout(()=>{
        if(USERS[next]){onLogin(USERS[next],next);}
        else if(next.length===5){
          if(USERS[next]){onLogin(USERS[next],next);}
          else{setError(true);setShake(true);setTimeout(()=>{setPin("");setShake(false);},600);}
        }
      },100);
    }
  };
  const del=()=>{setPin(p=>p.slice(0,-1));setError(false);};

  const dots=Array.from({length:5},(_,i)=>
    React.createElement("div",{key:i,style:{width:14,height:14,borderRadius:"50%",background:i<pin.length?(error?"#ef4444":"#E24B4A"):"#e5e7eb",transition:"background .15s"}})
  );

  const btn=(d,label)=>React.createElement("button",{onClick:()=>typeof d==="number"?press(String(d)):del(),style:{width:72,height:72,borderRadius:"50%",border:"1.5px solid #e5e7eb",background:"#fff",fontSize:d==="⌫"?22:22,fontWeight:600,color:"#111",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:2,boxShadow:"0 2px 8px rgba(0,0,0,.06)"}},
    d==="⌫"?React.createElement("span",null,"⌫"):React.createElement(React.Fragment,null,React.createElement("span",null,d),label&&React.createElement("span",{style:{fontSize:8,color:"#9ca3af",letterSpacing:1}},label))
  );

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100dvh",background:"#f8f9fa",padding:24}},
    React.createElement("div",{style:{width:64,height:64,borderRadius:16,background:"#E24B4A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,marginBottom:20,boxShadow:"0 8px 24px rgba(226,75,74,.3)"}},"🎛"),
    React.createElement("div",{style:{fontSize:22,fontWeight:700,color:"#111",marginBottom:4}},"TourDesk Pro"),
    React.createElement("div",{style:{fontSize:13,color:"#6b7280",marginBottom:36}},"Introduce tu PIN"),
    React.createElement("div",{style:{display:"flex",gap:14,marginBottom:36,animation:shake?"shake .4s":"none"}},dots),
    error&&React.createElement("div",{style:{fontSize:12,color:"#ef4444",marginBottom:16,fontWeight:600}},"PIN incorrecto"),
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:14}},
      btn(1,""),btn(2,"ABC"),btn(3,"DEF"),
      btn(4,"GHI"),btn(5,"JKL"),btn(6,"MNO"),
      btn(7,"PQRS"),btn(8,"TUV"),btn(9,"WXYZ"),
      React.createElement("div"),btn(0,""),btn("⌫")
    ),
    React.createElement("style",null,`@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}`)
  );
}
