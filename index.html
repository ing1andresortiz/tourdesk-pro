// useFirebaseStatus: tracks whether Firestore is connected/syncing
// status: "online" | "connecting" | "offline" | "error"
function useFirebaseStatus(){
  const [status,setStatus]=React.useState(fbDb?"connecting":"error");
  const [errMsg,setErrMsg]=React.useState(fbInitError);
  React.useEffect(()=>{
    if(!fbDb){ setStatus("error"); return; }
    const ref=fbDb.collection("tourdesk").doc("__ping__");
    // Try a write first to verify read+write permissions, then subscribe
    ref.set({ping:Date.now()},{merge:true}).catch(err=>{
      setErrMsg(err.code+": "+err.message);
      setStatus("error");
    });
    const unsub=ref.onSnapshot(
      ()=>setStatus("online"),
      err=>{ setErrMsg(err.code+": "+err.message); setStatus("error"); }
    );
    return unsub;
  },[]);
  return [status,errMsg];
}

// useSyncedState: like useState, but persists to localStorage immediately
// and syncs to/from Firestore in real time (collection "tourdesk", doc <key>, field "data").
function useSyncedState(key,initial){
  const [value,setValue]=React.useState(()=>{
    try{
      const saved=localStorage.getItem(key);
      if(saved){
        const parsed=JSON.parse(saved);
        if(Array.isArray(parsed)?parsed.length>0:parsed!=null) return parsed;
      }
    }catch(e){}
    return typeof initial==="function"?initial():initial;
  });
  const skipNext=React.useRef(false);

  // Write to localStorage on every change
  React.useEffect(()=>{
    try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){}
  },[key,value]);

  // Subscribe to Firestore changes (real-time)
  React.useEffect(()=>{
    if(!fbDb) return;
    const ref=fbDb.collection("tourdesk").doc(key);
    const unsub=ref.onSnapshot(snap=>{
      if(!snap.exists) return;
      const remote=snap.data().data;
      if(remote===undefined) return;
      // Avoid feedback loop: if this update was caused by our own write, skip once
      if(skipNext.current){ skipNext.current=false; return; }
      setValue(prev=>{
        if(JSON.stringify(prev)===JSON.stringify(remote)) return prev;
        return remote;
      });
    },err=>console.warn("Firestore sync error ("+key+")",err));
    return unsub;
  },[key]);

  // Wrapped setter: updates local state AND pushes to Firestore
  const setSynced=React.useCallback((updater)=>{
    setValue(prev=>{
      const next=typeof updater==="function"?updater(prev):updater;
      if(fbDb){
        skipNext.current=true;
        fbDb.collection("tourdesk").doc(key).set({data:next,updatedAt:Date.now()})
          .catch(err=>console.warn("Firestore write error ("+key+")",err));
      }
      return next;
    });
  },[key]);

  return [value,setSynced];
}

const fmtShort=d=>{const dt=new Date(d+"T12:00:00");return dt.getDate()+" "+dt.toLocaleDateString("es-ES",{month:"short"});};
const fmtFull=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"long"});
const monthName=d=>new Date(d+"-01T12:00:00").toLocaleDateString("es-ES",{month:"long",year:"numeric"});
const isToday=d=>new Date(d+"T12:00:00").toDateString()===new Date().toDateString();
const isPast=d=>new Date(d+"T12:00:00")<new Date()&&!isToday(d);
const groupM=arr=>{const g={};arr.forEach(s=>{const m=s.date.slice(0,7);if(!g[m])g[m]=[];g[m].push(s);});return g;};

function QuickLogShows({shows,finances,setFinances}){
  const [open,setOpen]=React.useState(false);
  const today=new Date().toISOString().slice(0,10);

  // Shows within ±14 days of today, sorted by date
  const relevant=shows.filter(s=>{
    const diff=(new Date(s.date+"T12:00:00")-new Date(today+"T12:00:00"))/(1000*60*60*24);
    return diff>=-7&&diff<=21;
  }).sort((a,b)=>a.date.localeCompare(b.date));

  const fmtDate=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"});

  const alreadyLogged=(showId,kind)=>finances.some(f=>f.showId===showId&&f.kind===kind);

  const logIncome=s=>{
    const r=SHOW_RATES[s.artist];
    if(!r)return;
    const concept=r.label+" — "+s.city;
    let amount=r.fee;
    if(r.rental>0) amount+=r.rental;
    setFinances(p=>[...p,{id:Date.now(),type:"income",date:s.date,concept,amount,artist:s.artist,showId:s.id,kind:"income"}]);
  };

  const logCrewPay=(s,memberId)=>{
    const rate=CREW_RATES[memberId];

    const member=TEAM.find(m=>m.id===memberId);
    const concept="Pago "+member.name+" — "+ARTISTS[s.artist].name+" "+s.city;
    setFinances(p=>[...p,{id:Date.now()+Math.random(),type:"expense",date:s.date,concept,amount:rate,artist:s.artist,showId:s.id,kind:"crew_"+memberId}]);
  };

  if(relevant.length===0) return null;

  return React.createElement("div",{style:{background:"#111111",borderRadius:11,padding:"11px 13px",marginBottom:13,border:"1px solid #1e1e1e"}},
    React.createElement("div",{onClick:()=>setOpen(!open),style:{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}},

    ),
    open&&React.createElement("div",{style:{marginTop:11}},
      relevant.map(s=>{
        const r=SHOW_RATES[s.artist];

        const crewAssigned=s.assigned.filter(a=>a!=="yo"&&CREW_RATES[a]);
        return React.createElement("div",{key:s.id,style:{padding:"9px 0",borderBottom:"1px solid #1a1a1a"}},
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:7,marginBottom:7}},

            React.createElement("span",{style:{fontSize:11,background:ARTISTS[s.artist].bg,color:ARTISTS[s.artist].color,borderRadius:5,padding:"2px 7px",fontWeight:700}},ARTISTS[s.artist].short),
            React.createElement("span",{style:{fontSize:12,color:"#ccc",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},s.city)
          ),
          React.createElement("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
            r&&React.createElement("button",{disabled:incomeDone,onClick:()=>logIncome(s),style:{padding:"6px 11px",borderRadius:8,border:incomeDone?"1px solid #1a3a1a":"1px solid #1a3a1a",background:incomeDone?"#0d150d":"#0a1a0a",color:incomeDone?"#3a6a3a":"#16a34a",fontWeight:700,fontSize:11,cursor:incomeDone?"default":"pointer"}},
              incomeDone?"✓ Ingreso registrado":"+ Ingreso ("+(r.fee+r.rental)+"€)"

// ── LOGIN
function LoginScreen({onLogin}){
  const [pin,setPin]=React.useState("");
  const [error,setError]=React.useState(false);

  const tryLogin=React.useCallback((p)=>{
    if(USERS[p]){
      setPin("");
      setError(false);
      onLogin(USERS[p]);
    } else {
      setError(true);
      setTimeout(()=>{ setPin(""); setError(false); }, 800);
    }
  },[onLogin]);

  const press=React.useCallback((d)=>{
    setPin(prev=>{
      if(prev.length>=5) return prev;
      const next=prev+d;
      // Auto-check at 4 digits (YO pin) or 5 digits
      if(next.length===4 && USERS[next]){
        setTimeout(()=>tryLogin(next),100);
        return next;
      }
      if(next.length===5){
        setTimeout(()=>tryLogin(next),100);
        return next;
      }
      return next;
    });
    setError(false);
  },[tryLogin]);

  const del=React.useCallback(()=>{ setPin(p=>p.slice(0,-1)); setError(false); },[]);

  const maxLen=5;
  const dots=Array.from({length:maxLen},(_,i)=>
    React.createElement("div",{key:i,style:{
      width:13,height:13,borderRadius:"50%",
      background:i<pin.length?(error?"#ef4444":"#E03A38"):"#2a2a2a",
      transition:"background .15s",
      transform:error?"scale(1.2)":"scale(1)"
    }})
  );

  const numBtn=(d)=>React.createElement("button",{
    onClick:()=>press(String(d)),
    style:{width:74,height:74,borderRadius:"50%",border:"1.5px solid #2a2a2a",background:"#1a1a1a",
      fontSize:22,fontWeight:600,color:"#f0ebe4",cursor:"pointer",
      display:"flex",alignItems:"center",justifyContent:"center",
      boxShadow:"0 2px 8px rgba(0,0,0,.06)",WebkitTapHighlightColor:"transparent"}
  },d);

  const delBtn=React.createElement("button",{
    onClick:del,
    style:{width:74,height:74,borderRadius:"50%",border:"none",background:"transparent",
      fontSize:22,color:"#666666",cursor:"pointer",WebkitTapHighlightColor:"transparent"}
  },"⌫");

  return React.createElement("div",{style:{
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
    height:"100dvh",width:"100%",background:"#0a0a0a",padding:24,userSelect:"none"
  }},
    React.createElement("div",{style:{marginBottom:32,textAlign:"center"}},
      React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-start",display:"inline-flex",flexDirection:"column"}},
        React.createElement("div",{style:{width:8,height:8,borderRadius:"50%",background:"#E03A38",marginBottom:10,boxShadow:"0 0 12px rgba(224,58,56,.5)"}}),
        React.createElement("div",{style:{fontFamily:"Bebas Neue,sans-serif",fontSize:52,lineHeight:.82,letterSpacing:4,color:"#f0ebe4"}},"OFF"),
        React.createElement("div",{style:{fontFamily:"Bebas Neue,sans-serif",fontSize:52,lineHeight:.82,letterSpacing:4,WebkitTextStroke:"1.5px rgba(240,235,228,.2)",color:"transparent"}},"STAGE"),
        React.createElement("div",{style:{width:32,height:1,background:"linear-gradient(to right,#E03A38,transparent)",margin:"10px 0 6px"}}),
        React.createElement("div",{style:{fontSize:7,letterSpacing:3,textTransform:"uppercase",color:"rgba(240,235,228,.25)",fontFamily:"DM Sans,sans-serif"}},"Tour Production · Worldwide")
      )
    ),
    React.createElement("div",{style:{fontSize:9,color:"#E03A38",marginBottom:40,letterSpacing:3,textTransform:"uppercase",fontFamily:"DM Sans,sans-serif"}},"Introduce tu PIN"),
    React.createElement("div",{style:{display:"flex",gap:16,marginBottom:12}},dots),
    React.createElement("div",{style:{fontSize:12,color:"#ef4444",fontWeight:600,height:20,marginBottom:24}},error?"PIN incorrecto":""),
    React.createElement("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,74px)",gap:14}},
      numBtn(1),numBtn(2),numBtn(3),
      numBtn(4),numBtn(5),numBtn(6),
      numBtn(7),numBtn(8),numBtn(9),
      React.createElement("div"),numBtn(0),delBtn
    )
  );
}

// ── ADMIN APP
function AdminApp({user, onLogout}){
  const [syncStatus,syncError]=useFirebaseStatus();
  const [dark,setDark]=React.useState(()=>localStorage.getItem("td_dark")==="1");
  React.useEffect(()=>{
    document.body.style.background=dark?"#050505":"#111111";
    localStorage.setItem("td_dark",dark?"1":"0");
  },[dark]);
  const [shows,setShows]=useSyncedState("td_shows",()=>{
    if(Array.isArray(ALL_SHOWS)&&ALL_SHOWS.length>0) return ALL_SHOWS;
    return [];
  });
  const [cases,setCases]=useSyncedState("td_cases",()=>{
    if(Array.isArray(INITIAL_CASES)&&INITIAL_CASES.length>0) return INITIAL_CASES;
    return [];
  });
  const [finances,setFinances]=useSyncedState("td_finances",()=>{
    if(Array.isArray(INITIAL_FINANCES)) return INITIAL_FINANCES;
    return [];
  });
  const [tab,setTab]=React.useState("shows");
  const todayMktg=MKTG.filter(e=>isToday(e.date));
  const conflicts=React.useMemo(()=>{
    const ids=new Set();const byDate={};
    shows.forEach(s=>{if(!byDate[s.date])byDate[s.date]=[];byDate[s.date].push(s);});
    Object.values(byDate).forEach(day=>{if(new Set(day.map(x=>x.artist)).size>=2)day.forEach(s=>ids.add(s.id));});
    return ids;
  },[shows]);
  const confDays=[...new Set(shows.filter(s=>conflicts.has(s.id)).map(s=>s.date))].length;
  const TABS=[{id:"shows",l:"📋"},{id:"conflicts",l:"⚡"+confDays},{id:"marketing",l:"📣"},{id:"office",l:"🏢"},{id:"material",l:"📦"},{id:"finance",l:"💰"},{id:"stats",l:"📊"}];
  const hdr="#111"; const tbar=dark?"#111":"#fff"; const tbdr=dark?"#2a2a2a":"#f3f4f6";
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100dvh",width:"100%",background:dark?"#050505":"#0d0d0d"}},
    React.createElement("div",{style:{background:hdr,padding:"12px 15px",display:"flex",alignItems:"center",gap:10,paddingTop:"max(12px,env(safe-area-inset-top))"}},
      React.createElement("div",{style:{width:36,height:36,borderRadius:0,background:"#E03A38",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontFamily:"Bebas Neue,sans-serif",letterSpacing:2,color:"#fff",fontWeight:400}},"OS"),
      React.createElement("div",{style:{flex:1}},
        React.createElement("div",{style:{fontSize:14,fontWeight:700,color:"#fff",fontFamily:"Bebas Neue,system-ui,sans-serif",letterSpacing:2}},"TourDesk Pro"),
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:5}},
          React.createElement("div",{style:{fontSize:8,color:"#E03A38",letterSpacing:2,textTransform:"uppercase",fontFamily:"DM Sans,sans-serif"}},"OFFSTAGE · "+shows.length+" SHOWS"),
          React.createElement("span",{onClick:()=>{if(syncError) alert("Firebase: "+syncError);},title:syncStatus==="online"?"Sincronizado":syncStatus==="connecting"?"Conectando...":syncStatus==="error"?("Error: "+syncError):"Sin conexión",style:{width:6,height:6,borderRadius:"50%",background:syncStatus==="online"?"#16a34a":syncStatus==="connecting"?"#d97706":syncStatus==="error"?"#ef4444":"#555",flexShrink:0,cursor:syncError?"pointer":"default"}})
        )
      ),
      React.createElement("button",{onClick:()=>setDark(d=>!d),style:{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"3px 6px"}},dark?"☀️":"🌙"),
      React.createElement("button",{onClick:onLogout,style:{background:"#2a2a2a",border:"none",borderRadius:8,color:"#aaa",fontSize:11,padding:"5px 9px",cursor:"pointer"}},"Salir"),
      todayMktg.length>0&&React.createElement("div",{onClick:()=>setTab("marketing"),style:{background:"#E03A38",borderRadius:20,padding:"3px 9px",fontSize:10,fontWeight:700,color:"#fff",cursor:"pointer"}},todayMktg.length+" HOY")
    ),
    React.createElement("div",{style:{background:"#0f0f0f",borderBottom:"1px solid #1e1e1e",display:"flex",flexShrink:0}},
      TABS.map(t=>React.createElement("button",{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:"11px 2px",border:"none",background:"transparent",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"DM Sans,sans-serif",letterSpacing:.5,color:tab===t.id?"#E03A38":"#555555",borderBottom:tab===t.id?"2.5px solid #E03A38":"2.5px solid transparent"}},t.l))
    ),
    tab==="shows"&&React.createElement(ShowsPanel,{shows,setShows,conflicts}),
    tab==="conflicts"&&React.createElement(ConflictsPanel,{shows,conflicts,setShows}),
    tab==="marketing"&&React.createElement(MktgPanel),
    tab==="office"&&React.createElement(OfficePanel),
    tab==="material"&&React.createElement(MaterialPanel,{cases,setCases}),
    tab==="finance"&&React.createElement(FinancePanel,{finances,setFinances,shows}),
    tab==="stats"&&React.createElement(StatsPanel,{shows,conflicts})
  );
}

// ── WORKER APP
function WorkerApp({user, onLogout}){
  const [shows]=useSyncedState("td_shows",()=>{
    if(Array.isArray(ALL_SHOWS)&&ALL_SHOWS.length>0) return ALL_SHOWS;
    return [];
  });
  return React.createElement(WorkerView,{user,shows,onLogout});
}

// ── ROOT
function App(){
  const [user,setUser]=React.useState(null);
  const login=React.useCallback((u)=>{ setUser(u); },[]);
  const logout=React.useCallback(()=>{ setUser(null); },[]);
  if(!user) return React.createElement(LoginScreen,{onLogin:login});
  if(user.role==="worker") return React.createElement(WorkerApp,{user,onLogout:logout});
  return React.createElement(AdminApp,{user,onLogout:logout});
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
