// useFirebaseStatus: tracks whether Firestore is connected/syncing
// status: "online" | "connecting" | "offline" | "error"
function useFirebaseStatus(){
  const [status,setStatus]=React.useState(fbDb?"connecting":"error");
  const [errMsg,setErrMsg]=React.useState(fbInitError);
  React.useEffect(()=>{
    if(!fbDb){ setStatus("error"); return; }
    const ref=fbDb.collection("tourdesk").doc("_ping");
    // Try a write first to verify read+write permissions, then subscribe
    ref.set({ping:Date.now()},{merge:true}).catch(err=>{
      setErrMsg(err.code+": "+err.message);
      setStatus("error");
    });
    const unsub=ref.onSnapshot(
      ()=>setStatus("online"),
      err=>{ setErrMsg(err.code+": "+err.message); setStatus("error"); }
    );
    return unsub;
  },[]);
  return [status,errMsg];
}

// useSyncedState: like useState, but persists to localStorage immediately
// and syncs to/from Firestore in real time (collection "tourdesk", doc <key>, field "data").
function useSyncedState(key,initial,opts){
  const sync=(!opts||opts.sync!==false); // sync:false → solo en memoria (sin localStorage ni Firestore)
  const [value,setValue]=React.useState(()=>{
    if(!sync) return typeof initial==="function"?initial():initial;
    try{
      const saved=localStorage.getItem(key);
      if(saved){
        const parsed=JSON.parse(saved);
        if(Array.isArray(parsed)?parsed.length>0:parsed!=null) return parsed;
      }
    }catch(e){}
    return typeof initial==="function"?initial():initial;
  });
  // Tracks the most recent JSON we wrote, so the matching server echo is ignored
  // (but any genuinely different remote change always wins).
  const lastWritten=React.useRef(null);
  const valueRef=React.useRef(value);
  valueRef.current=value;

  // Write to localStorage on every change
  React.useEffect(()=>{
    if(!sync) return;
    try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){}
  },[key,value,sync]);

  // Subscribe to Firestore changes (real-time)
  React.useEffect(()=>{
    if(!sync||!fbDb) return;
    const ref=fbDb.collection("tourdesk").doc(key);
    const unsub=ref.onSnapshot({includeMetadataChanges:false},function(snap){
      if(!snap.exists) return;
      const remote=snap.data().data;
      if(remote===undefined) return;
      const remoteJson=JSON.stringify(remote);
      // Ignore the echo of our own most recent write
      if(remoteJson===lastWritten.current) return;
      // Ignore if it already matches what we have
      if(remoteJson===JSON.stringify(valueRef.current)) return;
      // Genuine remote change → apply it
      setValue(remote);
    },function(err){ console.warn("Firestore sync error ("+key+")",err); });
    return unsub;
  },[key,sync]);

  // Wrapped setter: updates local state AND pushes to Firestore
  const setSynced=React.useCallback(function(updater){
    setValue(function(prev){
      const next=typeof updater==="function"?updater(prev):updater;
      const nextJson=JSON.stringify(next);
      lastWritten.current=nextJson;
      if(sync&&fbDb){
        fbDb.collection("tourdesk").doc(key).set({data:next,updatedAt:Date.now()})
          .catch(function(err){ console.warn("Firestore write error ("+key+")",err); });
      }
      return next;
    });
  },[key,sync]);

  return [value,setSynced];
}

  const arr=BASE_TEAM.slice();
  if(Array.isArray(custom)) custom.forEach(function(m){

// Reconstruye los globales ARTISTS y SHOW_RATES = base + artistas del usuario.
// Se llama en el render de AdminApp/WorkerApp para que TODOS los componentes
// (que leen ARTISTS/SHOW_RATES directamente) vean los artistas añadidos.
function applyCustomArtists(custom){
  const obj={...BASE_ARTISTS};
  const rates={...BASE_SHOW_RATES};
  if(custom&&typeof custom==="object"){
    Object.keys(custom).forEach(function(k){
      const a=custom[k]; if(!a) return;
      obj[k]={name:a.name,short:a.short,color:a.color,bg:a.bg};
      rates[k]={fee:Number(a.fee)||0,rental:Number(a.rental)||0,label:"Show "+a.name};
    });
  }
  // Proxy defensivo: si un show apunta a un artista borrado, devolvemos un
  // marcador en vez de romper la app. La iteración (Object.keys/entries) usa
  // las claves reales del objeto, así que no se ve afectada.
  ARTISTS=new Proxy(obj,{get:function(t,p){
    if(typeof p==="string"&&!(p in t)) return {name:"?",short:"?",color:"#888888",bg:"#1a1a1a"};
    return t[p];
  }});
  SHOW_RATES=rates;
}

// ── IMPORT / EXPORT DE SHOWS (Excel · CSV) ────────────────────
// SheetJS se carga bajo demanda (solo al importar/exportar) para no ralentizar
// el arranque. Requiere conexión la primera vez.
function loadXLSX(){
  return new Promise(function(resolve,reject){
    if(window.XLSX) return resolve(window.XLSX);
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=function(){ window.XLSX?resolve(window.XLSX):reject(new Error("Excel no disponible")); };
    s.onerror=function(){ reject(new Error("No se pudo cargar la librería de Excel (¿sin conexión?)")); };
    document.head.appendChild(s);
  });
}
function _stripAccents(str){ var out=""; for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); if(c>=768&&c<=879) continue; out+=str[i]; } return out; }
function _norm(v){ return _stripAccents(String(v==null?"":v).trim().toLowerCase().normalize("NFD")); }
function _p2(n){ return (n<10?"0":"")+n; }
// Valor de celda (Date · serie Excel · texto) -> "YYYY-MM-DD"
function toISODate(v){
  if(v==null||v==="") return "";
  if(v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+_p2(v.getMonth()+1)+"-"+_p2(v.getDate());
  if(typeof v==="number"){ var dn=new Date(Math.round((v-25569)*86400000)); if(!isNaN(dn)) return dn.getUTCFullYear()+"-"+_p2(dn.getUTCMonth()+1)+"-"+_p2(dn.getUTCDate()); }
  var s=String(v).trim();
  var m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m) return m[1]+"-"+_p2(+m[2])+"-"+_p2(+m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if(m){ var y=+m[3]; if(y<100)y+=2000; return y+"-"+_p2(+m[2])+"-"+_p2(+m[1]); }
  var d2=new Date(s); if(!isNaN(d2)) return d2.getFullYear()+"-"+_p2(d2.getMonth()+1)+"-"+_p2(d2.getDate());
  return "";
}
var _SHOWCOLS={
  date:["fecha","date","dia","fecha show","fecha del show","day"],
  artist:["artista","artist","acto","act","grupo","dj"],
  city:["ciudad","city","localidad","poblacion","town"],
  venue:["sala","venue","recinto","local","club","lugar","sitio"],
  status:["estado","status","confirmacion","confirmado"],
  assigned:["asignados","asignado","asignacion","trabajadores","trabajador","tecnicos","tecnico","workers","worker","crew","equipo","foh","responsable"],
  notes:["notas","nota","notes","observaciones","comentarios","obs"]
};
function _detectCols(hdr){
  var idx={};
  (hdr||[]).forEach(function(h,i){ var n=_norm(h); if(!n) return;
    Object.keys(_SHOWCOLS).forEach(function(f){ if(idx[f]!=null) return;
      if(_SHOWCOLS[f].some(function(sy){ return n===sy||(n.length>2&&n.indexOf(sy)>=0); })) idx[f]=i;
    });
  });
  return idx;
}
function _findArtistKey(name){
  var n=_norm(name); if(!n) return null;
  var ks=Object.keys(ARTISTS);
  for(var i=0;i<ks.length;i++){ var k=ks[i]; if(_norm(k)===n||_norm(ARTISTS[k].name)===n) return k; }
  return null;
}
// texto de asignados -> {ids:[memberIds], miss:[nombres no encontrados]}
function _matchWorkers(txt){
  var ids=[],miss=[];
  if(txt==null||txt==="") return {ids:ids,miss:miss};
  String(txt).split(/[,;\/|]+/).forEach(function(part){
    var n=_norm(part); if(!n) return;
    if(n==="yo"||n==="foh"||n.indexOf("yo (foh)")>=0){ if(ids.indexOf("yo")<0)ids.push("yo"); return; }
    var found=null;
    for(var i=0;i<TEAM.length;i++){ var m=TEAM[i]; var mn=_norm(m.name);
      if(mn===n||_norm(m.initials)===n||(n.length>2&&mn.indexOf(n)>=0)){ found=m.id; break; }
    }
    if(found){ if(ids.indexOf(found)<0)ids.push(found); } else miss.push(String(part).trim());
  });
  return {ids:ids,miss:miss};
}
// Lee un File (xlsx/xls/csv) -> {shows, newArtists, warnings} o {error}
function parseShowsFile(file){
  return loadXLSX().then(function(XLSX){
    return new Promise(function(resolve){
      var reader=new FileReader();
      reader.onload=function(e){
        try{
          var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""});
          if(!rows||!rows.length) return resolve({error:"El archivo está vacío."});
          var idx=_detectCols(rows[0]);
          if(idx.date==null) return resolve({error:"No encontré la columna FECHA. Descarga la plantilla o revisa las cabeceras (Fecha, Artista, Ciudad, Sala, Estado, Asignados, Notas)."});
          var base=Date.now(), shows=[], warnings=[], newArtists={};
          function makeKey(name){ var slug=_norm(name).replace(/[^a-z0-9]/g,"").slice(0,12)||"art"; var key=slug,i=2;
            var taken=function(k){ if(k in ARTISTS) return true; for(var nk in newArtists){ if(newArtists[nk].key===k) return true; } return false; };
            while(taken(key)){ key=slug+i; i++; } return key; }
          for(var r=1;r<rows.length;r++){
            var row=rows[r]; if(!row||row.every(function(c){return c===""||c==null;})) continue;
            var date=toISODate(row[idx.date]);
            if(!date){ warnings.push("Fila "+(r+1)+": fecha no válida, se omite."); continue; }
            var artName=idx.artist!=null?String(row[idx.artist]||"").trim():"";
            var aKey=_findArtistKey(artName);
            if(!aKey&&artName){ var nk=_norm(artName);
              if(newArtists[nk]) aKey=newArtists[nk].key;
              else { aKey=makeKey(artName); var pal=ARTIST_PALETTE[Object.keys(newArtists).length%ARTIST_PALETTE.length];
                newArtists[nk]={key:aKey,data:{name:artName,short:(artName.slice(0,2)||"?").toUpperCase(),color:pal[0],bg:pal[1],fee:0,rental:0}}; }
            }
            if(!aKey) aKey=Object.keys(ARTISTS)[0]||"luar";
            var wk=_matchWorkers(idx.assigned!=null?row[idx.assigned]:"");
            if(wk.miss.length) warnings.push("Fila "+(r+1)+": no reconocí a “"+wk.miss.join(", ")+"”, queda sin asignar.");
            var st=_norm(idx.status!=null?row[idx.status]:"");
            var status=(st.indexOf("tbc")>=0||st.indexOf("confirmar")>=0||st.indexOf("pend")>=0||st.indexOf("prov")>=0)?"tbc":"confirmed";
            shows.push({ id:base+shows.length, artist:aKey, date:date,
              venue:idx.venue!=null?String(row[idx.venue]||"").trim():"",
              city:idx.city!=null?String(row[idx.city]||"").trim():"",
              assigned:wk.ids, status:status,
              notes:idx.notes!=null?String(row[idx.notes]||"").trim():"" });
          }
          resolve({shows:shows,newArtists:Object.keys(newArtists).map(function(k){return newArtists[k];}),warnings:warnings});
        }catch(err){ resolve({error:"No pude leer el archivo: "+(err&&err.message?err.message:err)}); }
      };
      reader.onerror=function(){ resolve({error:"Error leyendo el archivo."}); };
      reader.readAsArrayBuffer(file);
    });
  });
}

function QuickLogShows({shows,finances,setFinances,workers}){

  // Shows cuyo cobro aún no se ha registrado (indicador en la cabecera)
  const pendingCount=shows.filter(s=>SHOW_RATES[s.artist]&&!finances.some(f=>f.showId===s.id&&f.kind==="income")).length;

function userForEmail(email){

      )
    ),

// ── ADMIN APP
function AdminApp({user, onLogout}){
  const canFinance=(user&&user.finance!==false); // false para un socio (Miguel): oculta y NO descarga finanzas
  const [syncStatus,syncError]=useFirebaseStatus();
  const [dark,setDark]=React.useState(()=>localStorage.getItem("td_dark")==="1");
  React.useEffect(()=>{
    document.body.style.background=dark?"#050505":"#111111";
    localStorage.setItem("td_dark",dark?"1":"0");
  },[dark]);
  const [shows,setShows]=useSyncedState("td_shows",()=>{
    if(Array.isArray(ALL_SHOWS)&&ALL_SHOWS.length>0) return ALL_SHOWS;
    return [];
  });
  const [cases,setCases]=useSyncedState("td_cases",()=>{
    if(Array.isArray(INITIAL_CASES)&&INITIAL_CASES.length>0) return INITIAL_CASES;
    return [];
  });
  const [finances,setFinances]=useSyncedState("td_finances",()=>{
    if(Array.isArray(INITIAL_FINANCES)) return INITIAL_FINANCES;
    return [];
  },{sync:canFinance});
  // Trabajadores para nómina (solo admin; privado, ni Miguel lo descarga).
  const [workers,setWorkers]=useSyncedState("td_workers",[],{sync:canFinance});
  const [team,setTeam]=useSyncedState("td_team",[]); // identidades de trabajadores (compartido, para asignarlos a shows)
  const [customArtists,setCustomArtists]=useSyncedState("td_artists",{});
  applyCustomArtists(customArtists); // reconstruye ARTISTS/SHOW_RATES antes de renderizar hijos
  applyCustomTeam(team); // añade los trabajadores al TEAM para poder asignarlos a shows
  const addArtist=React.useCallback(function(key,data){
    setCustomArtists(function(prev){ const n={...prev}; n[key]=data; return n; });
  },[setCustomArtists]);
  const removeArtist=React.useCallback(function(key){
    setCustomArtists(function(prev){ const n={...prev}; delete n[key]; return n; });
  },[setCustomArtists]);
  const [tab,setTab]=React.useState("shows");
  const todayMktg=MKTG.filter(e=>isToday(e.date));
  const conflicts=React.useMemo(()=>{
    const ids=new Set();const byDate={};
    shows.forEach(s=>{if(!byDate[s.date])byDate[s.date]=[];byDate[s.date].push(s);});
    Object.values(byDate).forEach(day=>{if(new Set(day.map(x=>x.artist)).size>=2)day.forEach(s=>ids.add(s.id));});
    return ids;
  },[shows]);
  const confDays=[...new Set(shows.filter(s=>conflicts.has(s.id)).map(s=>s.date))].length;
  const TABS=[{id:"shows",l:"📋"},{id:"conflicts",l:"⚡"+confDays},{id:"marketing",l:"📣"},{id:"office",l:"🏢"},{id:"material",l:"📦"}].concat(canFinance?[{id:"finance",l:"💰"}]:[]).concat([{id:"stats",l:"📊"}]);
  const hdr="#111"; const tbar=dark?"#111":"#fff"; const tbdr=dark?"#2a2a2a":"#f3f4f6";
  return React.createElement("div",{style:{display:"flex",flexDirection:"column",height:"100dvh",width:"100%",background:dark?"#050505":"#0d0d0d"}},
    React.createElement("div",{style:{background:hdr,padding:"12px 15px",display:"flex",alignItems:"center",gap:10,paddingTop:"max(12px,env(safe-area-inset-top))"}},
      React.createElement("div",{style:{width:36,height:36,borderRadius:0,background:"#E03A38",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontFamily:"Bebas Neue,sans-serif",letterSpacing:2,color:"#fff",fontWeight:400}},"OS"),
      React.createElement("div",{style:{flex:1}},
        React.createElement("div",{style:{fontSize:14,fontWeight:700,color:"#fff",fontFamily:"Bebas Neue,system-ui,sans-serif",letterSpacing:2}},"TourDesk Pro"),
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:5}},
          React.createElement("div",{style:{fontSize:8,color:"#E03A38",letterSpacing:2,textTransform:"uppercase",fontFamily:"DM Sans,sans-serif"}},"OFFSTAGE · "+shows.length+" SHOWS"),
          React.createElement("span",{onClick:()=>{if(syncError) alert("Firebase: "+syncError);},title:syncStatus==="online"?"Sincronizado":syncStatus==="connecting"?"Conectando...":syncStatus==="error"?("Error: "+syncError):"Sin conexión",style:{width:6,height:6,borderRadius:"50%",background:syncStatus==="online"?"#16a34a":syncStatus==="connecting"?"#d97706":syncStatus==="error"?"#ef4444":"#555",flexShrink:0,cursor:syncError?"pointer":"default"}})
        )
      ),
      React.createElement("button",{onClick:()=>setDark(d=>!d),style:{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"3px 6px"}},dark?"☀️":"🌙"),
      React.createElement("button",{onClick:onLogout,style:{background:"#2a2a2a",border:"none",borderRadius:8,color:"#aaa",fontSize:11,padding:"5px 9px",cursor:"pointer"}},"Salir"),
      todayMktg.length>0&&React.createElement("div",{onClick:()=>setTab("marketing"),style:{background:"#E03A38",borderRadius:20,padding:"3px 9px",fontSize:10,fontWeight:700,color:"#fff",cursor:"pointer"}},todayMktg.length+" HOY")
    ),
    React.createElement("div",{style:{background:"#0f0f0f",borderBottom:"1px solid #1e1e1e",display:"flex",flexShrink:0}},
      TABS.map(t=>React.createElement("button",{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:"11px 2px",border:"none",background:"transparent",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"DM Sans,sans-serif",letterSpacing:.5,color:tab===t.id?"#E03A38":"#555555",borderBottom:tab===t.id?"2.5px solid #E03A38":"2.5px solid transparent"}},t.l))
    ),
    tab==="shows"&&React.createElement(ShowsPanel,{shows,setShows,conflicts,onAddArtist:addArtist,onRemoveArtist:removeArtist,customArtists}),
    tab==="conflicts"&&React.createElement(ConflictsPanel,{shows,conflicts,setShows}),
    tab==="marketing"&&React.createElement(MktgPanel),
    tab==="office"&&React.createElement(OfficePanel),
    tab==="material"&&React.createElement(MaterialPanel,{cases,setCases}),
    tab==="finance"&&canFinance&&React.createElement(FinancePanel,{finances,setFinances,shows,workers,setWorkers,setTeam}),
    tab==="stats"&&React.createElement(StatsPanel,{shows,conflicts})
  );
}

// ── WORKER APP
function WorkerApp({user, onLogout}){
  const [shows]=useSyncedState("td_shows",()=>{
    if(Array.isArray(ALL_SHOWS)&&ALL_SHOWS.length>0) return ALL_SHOWS;
    return [];
  });
  const [customArtists]=useSyncedState("td_artists",{});
  applyCustomArtists(customArtists);
  const [team]=useSyncedState("td_team",[]);
  applyCustomTeam(team);
  return React.createElement(WorkerView,{user,shows,onLogout});
}

// ── ROOT
function App(){
  const [authUser,setAuthUser]=React.useState(undefined); // undefined=cargando sesión · null=sin sesión
  React.useEffect(function(){
    if(!fbAuth){ setAuthUser(null); return; }
    return fbAuth.onAuthStateChanged(function(u){ setAuthUser(u||null); });
  },[]);
  const logout=React.useCallback(function(){ if(fbAuth) fbAuth.signOut(); },[]);

  if(authUser===undefined){
    return React.createElement("div",{style:{height:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0a0a0a"}},React.createElement("div",{className:"spinner"}));
  }
  if(!authUser) return React.createElement(LoginScreen);

  const profile=userForEmail(authUser.email);
  if(!profile){
    return React.createElement("div",{style:{height:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"#0a0a0a",color:"#f0ebe4",padding:28,textAlign:"center",fontFamily:"DM Sans,system-ui,sans-serif"}},
      React.createElement("div",{style:{fontSize:32}},"🔒"),
      React.createElement("div",{style:{fontSize:15,fontWeight:700}},"Cuenta sin acceso"),
      React.createElement("div",{style:{fontSize:12,color:"#888",maxWidth:280,lineHeight:1.5}},"La cuenta "+(authUser.email||"")+" no está dada de alta en TourDesk. Pídele acceso a Andrés."),
      React.createElement("button",{onClick:logout,style:{marginTop:6,padding:"11px 22px",borderRadius:10,border:"1px solid #2a2a2a",background:"#1a1a1a",color:"#f0ebe4",fontWeight:600,fontSize:13,cursor:"pointer"}},"Salir")
    );
  }
  if(profile.role==="worker") return React.createElement(WorkerApp,{user:profile,onLogout:logout});
  return React.createElement(AdminApp,{user:profile,onLogout:logout});
}

// ── ERROR BOUNDARY ────────────────────────────────────────────
// Si algo lanza un error, en vez de pantalla en blanco mostramos un aviso
// y un botón para recargar. Los datos en Firestore/local no se pierden.
class ErrorBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(err){return {err:err};}
  componentDidCatch(err,info){console.error("TourDesk error:",err,info);}
  render(){
    if(this.state.err){
      return React.createElement("div",{style:{height:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,background:"#0a0a0a",color:"#f0ebe4",padding:28,textAlign:"center",fontFamily:"DM Sans,system-ui,sans-serif"}},
        React.createElement("div",{style:{fontSize:34}},"⚠️"),
        React.createElement("div",{style:{fontSize:15,fontWeight:700}},"Algo se ha atascado"),
        React.createElement("div",{style:{fontSize:12,color:"#888",maxWidth:300,lineHeight:1.5}},"Tus datos están a salvo. Recarga para volver a la app."),
        React.createElement("button",{onClick:function(){location.reload();},style:{marginTop:6,padding:"11px 22px",borderRadius:10,border:"none",background:"#E03A38",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}},"Recargar")
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(ErrorBoundary,null,React.createElement(App))
);
