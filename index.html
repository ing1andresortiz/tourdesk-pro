const useTheme=()=>{

  useEffect(()=>{

  return [dark,()=>setDark(d=>!d)];
};

/* ── HELPERS ── */
const fmtFull=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"long"});
const isToday=d=>new Date(d+"T12:00:00").toDateString()===new Date().toDateString();
const isPast=d=>new Date(d+"T12:00:00")<new Date()&&!isToday(d);
const isSoon=d=>{const diff=new Date(d+"T12:00:00")-new Date();return diff>0&&diff<3*86400000;};
const groupMonth=arr=>{const g={};arr.forEach(s=>{const m=s.date.slice(0,7);if(!g[m])g[m]=[];g[m].push(s);});return g;};
const e=React.createElement;

/* ── AVATAR ── */
const Av=({m,size=28})=>e('div',{style:{width:size,height:size,borderRadius:"50%",background:m.bg,color:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.34,fontWeight:700,flexShrink:0}},m.initials);

/* ── ASSIGN MODAL ── */
const AssignModal=({show,onClose,onSave,c})=>{
  const a=ARTISTS[show.artist];
  const [sel,setSel]=useState([...show.assigned]);
  const [status,setStatus]=useState(show.status);
  const [notes,setNotes]=useState(show.notes||"");
  const toggle=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return e('div',{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
    e('div',{onClick:ev=>ev.stopPropagation(),style:{background:c.surface,borderRadius:16,padding:22,width:"100%",maxWidth:480,boxShadow:"0 24px 64px rgba(0,0,0,.4)",maxHeight:"90vh",overflow:"auto"}},
      e('div',{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6}},
        e('span',{style:{background:a.bg,color:a.color,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}},a.name)
      ),
      e('div',{style:{fontSize:17,fontWeight:700,color:c.text,marginBottom:2}},show.venue),
      e('div',{style:{fontSize:12,color:c.text2,marginBottom:16}},fmtFull(show.date)+" · "+show.city),
      e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1,marginBottom:10}},"Técnico asignado"),
      TEAM.map(m=>{
        const on=sel.includes(m.id);
        return e('div',{key:m.id,onClick:()=>toggle(m.id),style:{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",borderRadius:10,border:on?`2px solid ${m.color}`:`2px solid ${c.border2}`,background:on?m.bg:c.surface2,cursor:"pointer",marginBottom:8}},
          e(Av,{m,size:30}),
          e('span',{style:{fontSize:13,fontWeight:600,color:on?m.color:c.text,flex:1}},m.name),
          on&&e('span',{style:{color:m.color,fontSize:16}},"✓")
        );
      }),
      e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1,margin:"14px 0 10px"}},"Estado"),
      e('div',{style:{display:"flex",gap:8,marginBottom:14}},
        [["confirmed","Confirmado","#16a34a"],["tbc","TBC","#d97706"],["done","Terminado","#6b7280"]].map(([v,l,col])=>
          e('div',{key:v,onClick:()=>setStatus(v),style:{flex:1,textAlign:"center",padding:"7px 4px",borderRadius:8,cursor:"pointer",border:status===v?`2px solid ${col}`:`2px solid ${c.border2}`,background:status===v?col+"22":c.surface2,color:status===v?col:c.text2,fontWeight:600,fontSize:12}},l)
        )
      ),
      e('textarea',{value:notes,onChange:ev=>setNotes(ev.target.value),placeholder:"Notas, rider técnico, contacto...",style:{width:"100%",padding:"9px 12px",borderRadius:10,border:`2px solid ${c.border2}`,fontSize:13,resize:"none",outline:"none",fontFamily:"inherit",minHeight:64,background:c.surface2,color:c.text,marginBottom:14}}),
      e('div',{style:{display:"flex",gap:8}},
        e('button',{onClick:onClose,style:{flex:1,padding:"10px",borderRadius:10,border:`2px solid ${c.border2}`,background:c.surface,color:c.text,fontWeight:600,fontSize:13,cursor:"pointer"}},"Cancelar"),
        e('button',{onClick:()=>onSave({...show,assigned:sel,status,notes}),style:{flex:2,padding:"10px",borderRadius:10,border:"none",background:"#E24B4A",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}},"Guardar")
      )
    )
  );
};

/* ── MARKETING MODAL ── */
const MktgModal=({event,onClose,c})=>{
  const [copied,setCopied]=useState(null);
  const copy=(text,id)=>{navigator.clipboard.writeText(text);setCopied(id);setTimeout(()=>setCopied(null),2000);};
  const t=TYPE_CFG[event.type];const a=ARTISTS[event.artist];
  return e('div',{onClick:onClose,style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:200,display:"flex",alignItems:"flex-end"}},
    e('div',{onClick:ev=>ev.stopPropagation(),style:{background:c.surface,borderRadius:"20px 20px 0 0",padding:"20px 16px 48px",width:"100%",maxHeight:"88vh",overflow:"auto"}},
      e('div',{style:{width:40,height:4,background:c.border2,borderRadius:2,margin:"0 auto 16px"}}),
      e('div',{style:{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}},
        e('span',{style:{background:a.bg,color:a.color,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}},a.name),
        e('span',{style:{background:t.bg,color:t.color,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}},t.emoji+" "+t.label),
        event.priority&&e('span',{style:{background:"#fef3c7",color:"#d97706",borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}},"⭐ Prioritario")
      ),
      e('div',{style:{fontSize:17,fontWeight:700,color:c.text,marginBottom:2}},event.venue),
      e('div',{style:{fontSize:12,color:c.text2,marginBottom:16}},"📅 "+fmtFull(event.date)+" · 📍 "+event.city+" · ⏰ "+event.time),
      e('div',{style:{background:c.surface2,borderRadius:12,padding:14,marginBottom:12}},
        e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"💡 Tip"),
        e('div',{style:{fontSize:13,color:c.text,lineHeight:1.6}},event.tip)
      ),
      e('div',{style:{background:c.surface2,borderRadius:12,padding:14,marginBottom:12}},
        e('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
          e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1}},"✍️ Caption"),
          e('button',{onClick:()=>copy(event.caption,"cap"),style:{padding:"4px 10px",background:copied==="cap"?"#16a34a":"#111",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer"}},copied==="cap"?"✓ Copiado":"Copiar")
        ),
        e('div',{style:{fontSize:13,color:c.text,lineHeight:1.6,whiteSpace:"pre-wrap"}},event.caption)
      ),
      e('div',{style:{background:c.surface2,borderRadius:12,padding:14}},
        e('div',{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
          e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1}},"# Hashtags"),
          e('button',{onClick:()=>copy(event.hashtags,"hash"),style:{padding:"4px 10px",background:copied==="hash"?"#16a34a":"#111",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer"}},copied==="hash"?"✓ Copiado":"Copiar")
        ),
        e('div',{style:{fontSize:12,color:c.text2,lineHeight:1.8}},event.hashtags)
      )
    )
  );
};

/* ── FILTER PILL ── */
const Pill=({label,active,color,bg,onClick,c})=>e('button',{onClick,style:{padding:"6px 13px",borderRadius:20,border:active?`2px solid ${color}`:`2px solid ${c.border2}`,background:active?bg:c.surface,color:active?color:c.text2,fontWeight:600,fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}},label);

/* ── MAIN APP ── */
function App(){
  const [dark,toggleDark]=useTheme();
  const c=C(dark);
  const [shows,setShows]=useState(INITIAL_SHOWS);
  const [editShow,setEditShow]=useState(null);
  const [mktgSel,setMktgSel]=useState(null);
  const [tab,setTab]=useState("shows");
  const [fa,setFa]=useState("all");
  const [fp,setFp]=useState("all");
  const [mf,setMf]=useState("all");

  const conflicts=useMemo(()=>{
    const ids=new Set();const byDate={};
    shows.forEach(s=>{if(!byDate[s.date])byDate[s.date]=[];byDate[s.date].push(s);});
    Object.values(byDate).forEach(day=>{if(new Set(day.map(x=>x.artist)).size>=2)day.forEach(s=>ids.add(s.id));});
    return ids;
  },[shows]);

  const filtShows=useMemo(()=>shows
    .filter(s=>fa==="all"||s.artist===fa)
    .filter(s=>fp==="all"||s.assigned.includes(fp))
    .sort((a,b)=>a.date.localeCompare(b.date)),[shows,fa,fp]);
  const grouped=useMemo(()=>groupMonth(filtShows),[filtShows]);
  const todayMktg=MKTG.filter(e=>isToday(e.date));
  const soonMktg=MKTG.filter(e=>isSoon(e.date));
  const filtMktg=useMemo(()=>MKTG.filter(e=>mf==="all"||e.artist===mf).sort((a,b)=>a.date.localeCompare(b.date)),[mf]);
  const conflictDays=[...new Set(shows.filter(s=>conflicts.has(s.id)).map(s=>s.date))].length;

  const TABS=[{id:"shows",label:"📋 Shows"},{id:"conflicts",label:"⚡ "+conflictDays},{id:"marketing",label:"📣 Mktg"},{id:"stats",label:"📊 Stats"}];

  const s=x=>({...x}); // shorthand

  return e('div',{style:{display:"flex",flexDirection:"column",height:"100dvh",width:"100%",background:c.bg,transition:"background .2s,color .2s"}},

    /* HEADER */
    e('div',{style:{background:c.header,padding:"13px 16px",display:"flex",alignItems:"center",gap:10,paddingTop:"max(13px,env(safe-area-inset-top))"}},
      e('div',{style:{width:36,height:36,borderRadius:10,background:"#E24B4A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}},"🎛"),
      e('div',{style:{flex:1}},
        e('div',{style:{fontSize:15,fontWeight:700,color:"#fff"}},"TourDesk Pro"),
        e('div',{style:{fontSize:10,color:"#9ca3af"}},"Euro Tours 2026 · "+shows.length+" shows · 3 artistas")
      ),
      /* dark mode toggle */
      e('button',{onClick:toggleDark,style:{background:"transparent",border:"none",cursor:"pointer",fontSize:18,padding:"4px 6px",borderRadius:8}},dark?"☀️":"🌙"),
      (todayMktg.length>0||soonMktg.length>0)&&e('div',{onClick:()=>setTab("marketing"),style:{background:"#E24B4A",borderRadius:20,padding:"4px 10px",fontSize:11,fontWeight:700,color:"#fff",cursor:"pointer"}},
        todayMktg.length>0?todayMktg.length+" HOY":soonMktg.length+" pronto"
      )
    ),

    /* TABS */
    e('div',{style:{background:c.tabBar,borderBottom:`1.5px solid ${c.border}`,display:"flex",flexShrink:0}},
      TABS.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:"11px 2px",border:"none",background:"transparent",fontSize:12,fontWeight:600,cursor:"pointer",color:tab===t.id?"#E24B4A":c.text3,borderBottom:tab===t.id?"2.5px solid #E24B4A":"2.5px solid transparent",transition:"color .15s"}},t.label))
    ),

    /* ── SHOWS ── */
    tab==="shows"&&e('div',{style:{flex:1,overflow:"auto",padding:"12px 16px 80px",width:"100%"}},
      e('div',{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}},
        [["all","Todos","#111","#111"],...Object.entries(ARTISTS).map(([k,a])=>[k,a.name,a.color,a.bg])].map(([k,label,color,bg])=>
          e(Pill,{key:k,label,active:fa===k,color:k==="all"?"#fff":""+color,bg:k==="all"?"#111":""+bg,onClick:()=>setFa(fa===k&&k!=="all"?"all":k),c})
        )
      ),
      e('div',{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
        [["all","Todos","#111","#111"],...TEAM.map(m=>[m.id,m.initials,m.color,m.bg])].map(([k,label,color,bg])=>
          e(Pill,{key:k,label,active:fp===k,color:k==="all"?"#fff":""+color,bg:k==="all"?"#111":""+bg,onClick:()=>setFp(fp===k&&k!=="all"?"all":k),c})
        )
      ),
      Object.keys(grouped).sort().map(month=>e('div',{key:month,style:{marginBottom:20}},
        e('div',{style:{fontSize:10,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10,display:"flex",alignItems:"center",gap:8}},
          e('span',null,new Date(month+"-01T12:00:00").toLocaleDateString("es-ES",{month:"long",year:"numeric"})),
          e('span',{style:{background:c.surface2,color:c.text2,borderRadius:20,padding:"1px 8px",fontSize:10}},grouped[month].length)
        ),
        grouped[month].map(s=>{
          const a=ARTISTS[s.artist];const members=TEAM.filter(m=>s.assigned.includes(m.id));const conflict=conflicts.has(s.id);
          return e('div',{key:s.id,onClick:()=>setEditShow(s),style:{background:conflict?"#3d000010":c.surface,borderRadius:12,padding:"12px 14px",marginBottom:8,cursor:"pointer",border:conflict?"2px solid #fca5a5":`1.5px solid ${c.border}`,boxShadow:dark?"none":"0 1px 3px rgba(0,0,0,.05)"}},
            e('div',{style:{display:"flex",alignItems:"flex-start",gap:10}},
              e('div',{style:{textAlign:"center",minWidth:34}},
                e('div',{style:{fontSize:17,fontWeight:800,color:c.text,lineHeight:1}},new Date(s.date+"T12:00:00").getDate()),
                e('div',{style:{fontSize:9,color:c.text3,textTransform:"uppercase"}},new Date(s.date+"T12:00:00").toLocaleDateString("es-ES",{month:"short"}))
              ),
              e('div',{style:{flex:1,minWidth:0}},
                e('div',{style:{display:"flex",alignItems:"center",gap:5,marginBottom:4,flexWrap:"wrap"}},
                  e('span',{style:{background:a.bg,color:a.color,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}},a.short),
                  conflict&&e('span',{style:{fontSize:10,color:"#ef4444",fontWeight:700}},"⚡")
                ),
                e('div',{style:{fontSize:14,fontWeight:700,color:c.text,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},s.venue),
                e('div',{style:{fontSize:12,color:c.text2}},"📍 "+s.city)
              ),
              e('div',{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,flexShrink:0}},
                e('span',{style:{fontSize:10,fontWeight:600,color:s.status==="confirmed"?"#16a34a":s.status==="tbc"?"#d97706":"#6b7280"}},s.status==="confirmed"?"● Conf.":s.status==="tbc"?"● TBC":"● Listo"),
                e('div',{style:{display:"flex"}},
                  members.length===0
                    ?e('span',{style:{fontSize:10,color:"#f59e0b",fontWeight:600}},"Sin asignar")
                    :members.map((m,i)=>e('div',{key:m.id,style:{marginLeft:i>0?-7:0,border:`2px solid ${c.surface}`,borderRadius:"50%"}},e(Av,{m,size:26})))
                )
              )
            ),
            s.notes&&e('div',{style:{marginTop:8,padding:"6px 10px",background:c.surface2,borderRadius:8,fontSize:11,color:c.text2}},"📝 "+s.notes)
          );
        })
      ))
    ),

    /* ── CONFLICTS ── */
    tab==="conflicts"&&e('div',{style:{flex:1,overflow:"auto",padding:"16px 16px 80px"}},
      conflictDays===0
        ?e('div',{style:{textAlign:"center",padding:60,color:"#16a34a"}},e('div',{style:{fontSize:36,marginBottom:10}},"✅"),e('div',{style:{fontSize:14,fontWeight:600,color:c.text}},"Sin conflictos"))
        :e('div',null,
          e('div',{style:{background:"#fef2f2",border:"1.5px solid #fca5a5",borderRadius:12,padding:"11px 14px",marginBottom:16,fontSize:12,color:"#dc2626",fontWeight:500}},
            "⚡ "+conflictDays+" días con shows simultáneos. Toca para reasignar."
          ),
          Object.entries(groupMonth(shows.filter(s=>conflicts.has(s.id)).sort((a,b)=>a.date.localeCompare(b.date)))).sort().map(([month,ss])=>
            e('div',{key:month,style:{marginBottom:20}},
              e('div',{style:{fontSize:10,fontWeight:700,color:"#dc2626",textTransform:"uppercase",letterSpacing:1,marginBottom:10}},new Date(month+"-01T12:00:00").toLocaleDateString("es-ES",{month:"long"})),
              ss.map(s=>{
                const a=ARTISTS[s.artist];const members=TEAM.filter(m=>s.assigned.includes(m.id));
                return e('div',{key:s.id,onClick:()=>setEditShow(s),style:{background:c.surface,borderRadius:12,padding:"11px 14px",marginBottom:8,cursor:"pointer",border:"2px solid #fca5a5"}},
                  e('div',{style:{display:"flex",alignItems:"center",gap:10}},
                    e('div',{style:{textAlign:"center",minWidth:34}},
                      e('div',{style:{fontSize:17,fontWeight:800,color:"#dc2626"}},new Date(s.date+"T12:00:00").getDate()),
                      e('div',{style:{fontSize:9,color:c.text3,textTransform:"uppercase"}},new Date(s.date+"T12:00:00").toLocaleDateString("es-ES",{month:"short"}))
                    ),
                    e('div',{style:{flex:1}},
                      e('span',{style:{background:a.bg,color:a.color,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700,marginBottom:4,display:"inline-block"}},a.name),
                      e('div',{style:{fontSize:13,fontWeight:700,color:c.text}},s.venue),
                      e('div',{style:{fontSize:11,color:c.text2}},"📍 "+s.city)
                    ),
                    e('div',{style:{display:"flex"}},members.map((m,i)=>e('div',{key:m.id,style:{marginLeft:i>0?-7:0,border:`2px solid ${c.surface}`,borderRadius:"50%"}},e(Av,{m,size:26}))))
                  )
                );
              })
            )
          )
        )
    ),

    /* ── MARKETING ── */
    tab==="marketing"&&e('div',{style:{flex:1,overflow:"auto",padding:"12px 16px 80px"}},
      todayMktg.length>0&&e('div',{style:{background:"#fef2f2",border:"2px solid #E24B4A",borderRadius:12,padding:"11px 14px",marginBottom:12}},
        e('div',{style:{fontSize:11,fontWeight:700,color:"#E24B4A",marginBottom:6}},"🔴 PUBLICAR HOY"),
        todayMktg.map(ev=>e('div',{key:ev.id,onClick:()=>setMktgSel(ev),style:{fontSize:12,color:"#111",cursor:"pointer",padding:"4px 0",borderBottom:"0.5px solid #fca5a5"}},TYPE_CFG[ev.type].emoji+" "+ev.venue+" — "+ev.city))
      ),
      MKTG.filter(ev=>ev.priority).length>0&&e('div',{style:{marginBottom:16}},
        e('div',{style:{fontSize:10,fontWeight:700,color:"#d97706",textTransform:"uppercase",letterSpacing:1,marginBottom:8}},"⭐ Shows prioritarios"),
        MKTG.filter(ev=>ev.priority).map(ev=>{
          const a=ARTISTS[ev.artist];
          return e('div',{key:ev.id,onClick:()=>setMktgSel(ev),style:{background:dark?"#2a2200":"#fffbeb",border:"1.5px solid #fcd34d",borderRadius:12,padding:"10px 14px",marginBottom:7,cursor:"pointer",display:"flex",alignItems:"center",gap:10}},
            e('div',{style:{textAlign:"center",minWidth:34}},
              e('div',{style:{fontSize:15,fontWeight:800,color:"#d97706"}},new Date(ev.date+"T12:00:00").getDate()),
              e('div',{style:{fontSize:9,color:c.text3,textTransform:"uppercase"}},new Date(ev.date+"T12:00:00").toLocaleDateString("es-ES",{month:"short"}))
            ),
            e('div',{style:{flex:1}},
              e('span',{style:{background:a.bg,color:a.color,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700,marginBottom:3,display:"inline-block"}},a.name),
              e('div',{style:{fontSize:13,fontWeight:700,color:c.text}},ev.venue),
              e('div',{style:{fontSize:11,color:c.text2}},"📍 "+ev.city)
            ),
            e('span',{style:{fontSize:20}},TYPE_CFG[ev.type].emoji)
          );
        })
      ),
      e('div',{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}},
        [["all","Todos","#fff","#111"],...Object.entries(ARTISTS).map(([k,a])=>[k,a.name,a.color,a.bg])].map(([k,label,color,bg])=>
          e(Pill,{key:k,label,active:mf===k,color:k==="all"?"#fff":""+color,bg:k==="all"?"#111":""+bg,onClick:()=>setMf(mf===k&&k!=="all"?"all":k),c})
        )
      ),
      filtMktg.map(ev=>{
        const a=ARTISTS[ev.artist];const t=TYPE_CFG[ev.type];
        const today=isToday(ev.date);const past=isPast(ev.date);const soon=isSoon(ev.date);
        return e('div',{key:ev.id,onClick:()=>setMktgSel(ev),style:{background:today?(dark?"#2a0000":"#fff8f8"):c.surface,borderRadius:12,padding:"10px 14px",marginBottom:8,cursor:"pointer",border:today?"2px solid #E24B4A":soon?"2px solid #f59e0b":`1.5px solid ${c.border}`,opacity:past?.5:1}},
          e('div',{style:{display:"flex",alignItems:"center",gap:10}},
            e('div',{style:{textAlign:"center",minWidth:34}},
              e('div',{style:{fontSize:15,fontWeight:800,color:today?"#E24B4A":c.text}},new Date(ev.date+"T12:00:00").getDate()),
              e('div',{style:{fontSize:9,color:c.text3,textTransform:"uppercase"}},new Date(ev.date+"T12:00:00").toLocaleDateString("es-ES",{month:"short"}))
            ),
            e('div',{style:{flex:1,minWidth:0}},
              e('div',{style:{display:"flex",gap:5,marginBottom:3,flexWrap:"wrap"}},
                e('span',{style:{background:a.bg,color:a.color,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}},a.name),
                e('span',{style:{background:t.bg,color:t.color,borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}},t.emoji+" "+t.label),
                today&&e('span',{style:{background:"#E24B4A",color:"#fff",borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}},"HOY"),
                ev.priority&&e('span',{style:{background:"#fef3c7",color:"#d97706",borderRadius:5,padding:"1px 7px",fontSize:10,fontWeight:700}},"⭐")
              ),
              e('div',{style:{fontSize:13,fontWeight:700,color:c.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},ev.venue),
              e('div',{style:{fontSize:11,color:c.text2}},"📍 "+ev.city+" · ⏰ "+ev.time)
            ),
            e('span',{style:{fontSize:16,color:c.text3}},"›")
          )
        );
      })
    ),

    /* ── STATS ── */
    tab==="stats"&&e('div',{style:{flex:1,overflow:"auto",padding:"16px 16px 80px"}},
      e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}},
        [["Shows totales",shows.length,"#E24B4A"],["Confirmados",shows.filter(s=>s.status==="confirmed").length,"#16a34a"],["TBC",shows.filter(s=>s.status==="tbc").length,"#d97706"],["Conflictos",conflictDays,"#ef4444"]].map(([l,v,col])=>
          e('div',{key:l,style:{background:c.surface,borderRadius:12,padding:"14px",border:`1.5px solid ${c.border}`}},
            e('div',{style:{fontSize:11,color:c.text3,fontWeight:600,marginBottom:4}},l),
            e('div',{style:{fontSize:28,fontWeight:800,color:col}},v)
          )
        )
      ),
      e('div',{style:{background:c.surface,borderRadius:12,padding:"14px 16px",border:`1.5px solid ${c.border}`,marginBottom:12}},
        e('div',{style:{fontSize:11,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1,marginBottom:14}},"Shows por artista"),
        Object.entries(ARTISTS).map(([k,a])=>{
          const count=shows.filter(s=>s.artist===k).length;
          return e('div',{key:k,style:{marginBottom:12}},
            e('div',{style:{display:"flex",justifyContent:"space-between",marginBottom:5}},
              e('span',{style:{fontSize:13,fontWeight:600,color:a.color}},a.name),
              e('span',{style:{fontSize:13,fontWeight:700,color:c.text}},count)
            ),
            e('div',{style:{height:7,background:c.surface2,borderRadius:4}},
              e('div',{style:{height:7,background:a.color,borderRadius:4,width:`${(count/shows.length)*100}%`}})
            )
          );
        })
      ),
      e('div',{style:{background:c.surface,borderRadius:12,padding:"14px 16px",border:`1.5px solid ${c.border}`}},
        e('div',{style:{fontSize:11,fontWeight:700,color:c.text3,textTransform:"uppercase",letterSpacing:1,marginBottom:14}},"Carga por técnico"),
        TEAM.map(m=>{
          const count=shows.filter(s=>s.assigned.includes(m.id)).length;
          return e('div',{key:m.id,style:{marginBottom:12}},
            e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
              e('div',{style:{display:"flex",alignItems:"center",gap:8}},e(Av,{m,size:26}),e('span',{style:{fontSize:13,fontWeight:600,color:c.text}},m.name)),
              e('span',{style:{fontSize:13,fontWeight:700,color:m.color}},count+" shows")
            ),
            e('div',{style:{height:7,background:c.surface2,borderRadius:4}},
              e('div',{style:{height:7,background:m.color,borderRadius:4,width:`${(count/shows.length)*100}%`}})
            )
          );
        })
      )
    ),

    /* MODALS */
    editShow&&e(AssignModal,{show:editShow,onClose:()=>setEditShow(null),onSave:s=>{setShows(p=>p.map(x=>x.id===s.id?s:x));setEditShow(null);},c}),
    mktgSel&&e(MktgModal,{event:mktgSel,onClose:()=>setMktgSel(null),c})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
