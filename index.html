const fmtFull = d => new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"short",day:"2-digit",month:"long"});
const isToday = d => new Date(d+"T12:00:00").toDateString()===new Date().toDateString();
const isPast  = d => new Date(d+"T12:00:00")<new Date()&&!isToday(d);
const isSoon  = d => { const diff=new Date(d+"T12:00:00")-new Date(); return diff>0&&diff<3*86400000; };
const groupMonth = arr => {
  const g={};
  arr.forEach(s=>{ const m=s.date.slice(0,7); if(!g[m])g[m]=[]; g[m].push(s); });
  return g;
};

const Av = ({m,size=28}) => (
  React.createElement('div',{style:{width:size,height:size,borderRadius:"50%",background:m.bg,color:m.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.34,fontWeight:700,flexShrink:0}},m.initials)
);

const AssignModal = ({show,onClose,onSave}) => {
  const a=ARTISTS[show.artist];
  const [sel,setSel]=useState([...show.assigned]);
  const [status,setStatus]=useState(show.status);
  const [notes,setNotes]=useState(show.notes||"");
  const toggle=id=>setSel(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:22,width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,.25)",maxHeight:"90vh",overflow:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{background:a.bg,color:a.color,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>{a.name}</span>
        </div>
        <div style={{fontSize:17,fontWeight:700,color:"#111",marginBottom:2}}>{show.venue}</div>
        <div style={{fontSize:12,color:"#6b7280",marginBottom:16}}>{fmtFull(show.date)} · {show.city}</div>
        <div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>Técnico asignado</div>
        {TEAM.map(m=>{
          const on=sel.includes(m.id);
          return React.createElement('div',{key:m.id,onClick:()=>toggle(m.id),style:{display:"flex",alignItems:"center",gap:12,padding:"9px 12px",borderRadius:10,border:on?`2px solid ${m.color}`:"2px solid #e5e7eb",background:on?m.bg:"#fafafa",cursor:"pointer",marginBottom:8}},
            React.createElement(Av,{m,size:30}),
            React.createElement('span',{style:{fontSize:13,fontWeight:600,color:on?m.color:"#374151",flex:1}},m.name),
            on&&React.createElement('span',{style:{color:m.color,fontSize:16}},"✓")
          );
        })}
        <div style={{fontSize:10,fontWeight:700,color:"#9ca3af",textTransform:"uppercase",letterSpacing:1,margin:"14px 0 10px"}}>Estado</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[["confirmed","Confirmado","#16a34a"],["tbc","TBC","#d97706"],["done","Terminado","#6b7280"]].map(([v,l,c])=>
            React.createElement('div',{key:v,onClick:()=>setStatus(v),style:{flex:1,textAlign:"center",padding:"7px 4px",borderRadius:8,cursor:"pointer",border:status===v?`2px solid ${c}`:"2px solid #e5e7eb",background:status===v?c+"15":"#fafafa",color:status===v?c:"#6b7280",fontWeight:600,fontSize:12}},l)
          )}
        </div>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Notas, rider técnico, contacto..." style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"2px solid #e5e7eb",fontSize:13,resize:"none",outline:"none",fontFamily:"inherit",minHeight:64,background:"#fafafa",marginBottom:14}}/>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onClose} style={{flex:1,padding:"10px",borderRadius:10,border:"2px solid #e5e7eb",background:"#fff",color:"#374151",fontWeight:600,fontSize:13,cursor:"pointer"}}>Cancelar</button>
          <button onClick={()=>onSave({...show,assigned:sel,status,notes})} style={{flex:2,padding:"10px",borderRadius:10,border:"none",background:"#111",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer"}}>Guardar</button>
        </div>
      </div>
    </div>
  );
};

const MktgModal = ({event,onClose}) => {
  const [copied,setCopied]=useState(null);
